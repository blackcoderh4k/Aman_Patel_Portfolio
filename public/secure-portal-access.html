<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal | Portfolio</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/secure-portal-access.css">
</head>
<body>
    <!-- Background Effects -->
    <div class="global-bg-glow">
        <div class="glow-blob glow-left"></div>
        <div class="glow-blob glow-right"></div>
    </div>

    <!-- Login Section -->
    <div id="loginSection" class="auth-container">
        <div class="glass-panel login-panel">
            <div class="login-header">
                <h2><i class="fas fa-lock"></i> Secure Access</h2>
                <p>Enter administrator PIN to interact with terminal database.</p>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-key input-icon"></i>
                    <input type="password" id="adminPassword" placeholder="Enter Password" required>
                </div>
                <div id="loginError" class="error-msg"></div>
                <button type="submit" class="submit-btn">
                    <span>Authenticate</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Return to Portfolio</a>
        </div>
    </div>

    <!-- Dashboard Section (Hidden by Default) -->
    <div id="dashboardSection" class="dashboard-container" style="display: none;">
        <nav class="dashboard-nav glass-panel">
            <div class="nav-brand">
                <h1><i class="fas fa-database"></i> Portfolio Comms</h1>
            </div>
            <div class="nav-actions">
                <span id="messageCount" class="badge">0 Messages</span>
                <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Disconnect</button>
            </div>
        </nav>

        <main class="dashboard-main">
            <div class="dashboard-header">
                <h2>Incoming Transmissions</h2>
                <button id="refreshBtn" class="action-btn" title="Refresh Data"><i class="fas fa-sync-alt"></i></button>
            </div>

            <!-- Loader -->
            <div id="loader" class="loader-container">
                <div class="spinner"></div>
                <p>Decrypting records...</p>
            </div>

            <!-- Messages Grid -->
            <div id="messagesGrid" class="messages-grid">
                <!-- Cards injected here via JS -->
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-inbox"></i>
                <p>No messages received yet.</p>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/secure-portal-access.js"></script>
</body>
</html>
