<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Lost in Space - Aman Patel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }
        
        .error-content {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            backdrop-filter: blur(20px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(0, 240, 255, 0.05);
            animation: errorFloat 4s ease-in-out infinite alternate;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--main-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-family: var(--font-code);
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .error-message {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .error-desc {
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        @keyframes errorFloat {
            0% { transform: translateY(0px); filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.2)); }
            100% { transform: translateY(-15px); filter: drop-shadow(0 0 40px rgba(122, 4, 235, 0.3)); }
        }
    </style>
</head>
<body>
    <!-- Global Space Background -->
    <div class="global-bg-glow">
        <div class="glow-blob glow-left"></div>
        <div class="glow-blob glow-right"></div>
    </div>
    
    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <section class="error-section container">
        <div class="error-content">
            <div class="error-code">404</div>
            <h2 class="error-message">Space-Time Distortion Detected</h2>
            <p class="error-desc">The sector you are looking for has been swallowed by a black hole or never existed. Let's get you back to safe coordinates.</p>
            <a href="/" class="btn primary-btn">
                <i class="fas fa-space-shuttle"></i> Return to Base
            </a>
        </div>
    </section>

    <!-- Cursor Logic -->
    <script>
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');
        
        let isCursorMoving = false;
        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;

        window.addEventListener('mousemove', (e) => {
            cursorX = e.clientX;
            cursorY = e.clientY;
            
            if (!isCursorMoving) {
                isCursorMoving = true;
                requestAnimationFrame(() => {
                    cursorDot.style.left = `${cursorX}px`;
                    cursorDot.style.top = `${cursorY}px`;
                    
                    cursorOutline.animate({
                        left: `${cursorX}px`,
                        top: `${cursorY}px`
                    }, { duration: 400, fill: "forwards" });
                    isCursorMoving = false;
                });
            }
        }, { passive: true });
        
        const btn = document.querySelector('.btn');
        if(btn) {
            btn.addEventListener('mouseenter', () => {
                cursorOutline.style.width = '50px';
                cursorOutline.style.height = '50px';
                cursorOutline.style.borderColor = 'rgba(0, 240, 255, 0.6)';
                cursorOutline.style.backgroundColor = 'rgba(0, 240, 255, 0.05)';
                cursorDot.style.transform = 'translate(-50%, -50%) scale(1.5)';
            });
            btn.addEventListener('mouseleave', () => {
                cursorOutline.style.width = '32px';
                cursorOutline.style.height = '32px';
                cursorOutline.style.borderColor = 'rgba(0, 240, 255, 0.4)';
                cursorOutline.style.backgroundColor = 'transparent';
                cursorDot.style.transform = 'translate(-50%, -50%) scale(1)';
            });
        }
    </script>
</body>
</html>
